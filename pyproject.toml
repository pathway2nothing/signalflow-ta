[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalflow-ta"
version = "0.8.5"
description = "Technical analysis extension for signalflow-trading."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "signalflow-trading>=0.8.0",
]

[project.entry-points."signalflow.components"]
ta = "signalflow.ta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["signalflow.ta*"]

[project.optional-dependencies]
numba = [
  "numba>=0.58.0",
]
test = [
  "pytest>=8",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# Mathematical docstrings use Greek letters and true minus signs; do not fight that style.
ignore = ["RUF001", "RUF002", "RUF003", "E741"]  # h, l, c are idiomatic OHLC names

[tool.ruff.lint.per-file-ignores]
"src/signalflow/ta/__init__.py" = ["E402", "F401"]  # plugin API marker first; re-exports
"tests/*" = ["E402"]  # namespace-path bridge and warning filters precede imports

[tool.ruff.lint.isort]
known-first-party = ["signalflow"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_return_any = true
strict_equality = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "numba",
  "numba.*",
  "scipy",
  "scipy.*",
  "sklearn",
  "sklearn.*",
]
ignore_missing_imports = true
follow_untyped_imports = true
