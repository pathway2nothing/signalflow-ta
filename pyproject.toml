[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalflow-ta"
version = "0.5.0"
description = "Technical analysis extension for signalflow-trading."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "signalflow-trading>=0.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["signalflow.ta*"]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["signalflow"]
