name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv
      - name: Install core (dev branch) + plugin with numba
        run: |
          uv pip install "signalflow-trading @ git+https://github.com/pathway2nothing/signalflow-trading@dev"
          uv pip install -e ".[numba,test]"
      - name: Lint (ruff)
        run: uvx ruff@0.15.14 check src tests
      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: .venv/bin/python -m pytest -q
